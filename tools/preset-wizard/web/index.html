<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preset Manager (LOCAL)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <div>
          <h1>Preset Manager (LOCAL)</h1>
          <p class="muted">
            Crear, editar, regenerar grid 2x2 y borrar presets de restyle o lightroom.
          </p>
        </div>

        <div class="topbar-actions">
          <label class="kind-pill">
            <input type="radio" name="kind" value="restyle" checked />
            <span>Styles</span>
          </label>

          <label class="kind-pill">
            <input type="radio" name="kind" value="lightroom" />
            <span>Lighting</span>
          </label>
        </div>
      </div>

      <div class="layout">
        <aside class="sidebar card">
          <div class="sidebar-head">
            <input id="search" class="input" placeholder="Buscar preset..." />
            <button id="newPreset" class="btn primary" type="button">Nuevo preset</button>
          </div>

          <div id="presetList" class="preset-list"></div>
        </aside>

        <main class="editor card">
          <div class="editor-head">
            <div>
              <div class="kicker">EDITOR</div>
              <h2 id="editorTitle">Nuevo preset</h2>
            </div>

            <div class="row">
              <button id="deletePreset" class="btn danger" type="button">Eliminar preset</button>
              <button id="savePreset" class="btn primary" type="button">Guardar preset</button>
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label class="label">Nombre del preset</label>
              <input id="name" class="input" placeholder="Ej: Anime Soft" />
            </div>

            <div>
              <label class="label">ID</label>
              <input id="id" class="input" placeholder="ej: anime_soft" />
            </div>
          </div>

          <div class="muted">
            Archivo TS: <code id="savePathTs"></code><br />
            Carpeta pública: <code id="savePathPublic"></code>
          </div>

          <hr />

          <label class="label">Prompt del preset</label>
          <textarea id="prompt" class="textarea" placeholder="Pega aquí el prompt completo del preset..."></textarea>

          <hr />

          <div class="section-title">Cover</div>
          <div class="asset-row">
            <div class="asset-preview" id="coverPreview"></div>
            <div class="asset-actions">
              <input id="cover" class="input" type="file" accept=".png,.jpg,.jpeg,.webp" />
              <button id="clearCover" class="btn" type="button">Quitar cover</button>
            </div>
          </div>

          <hr />

          <div class="section-title">Imágenes de ejemplo (1, 2, 3, 4)</div>
          <div class="examples-grid">
            <div class="example-card">
              <div class="example-label">1</div>
              <div class="asset-preview" id="examplePreview1"></div>
              <input id="example1" class="input" type="file" accept=".png,.jpg,.jpeg,.webp" />
              <button data-clear-example="1" class="btn clear-example" type="button">Quitar</button>
            </div>

            <div class="example-card">
              <div class="example-label">2</div>
              <div class="asset-preview" id="examplePreview2"></div>
              <input id="example2" class="input" type="file" accept=".png,.jpg,.jpeg,.webp" />
              <button data-clear-example="2" class="btn clear-example" type="button">Quitar</button>
            </div>

            <div class="example-card">
              <div class="example-label">3</div>
              <div class="asset-preview" id="examplePreview3"></div>
              <input id="example3" class="input" type="file" accept=".png,.jpg,.jpeg,.webp" />
              <button data-clear-example="3" class="btn clear-example" type="button">Quitar</button>
            </div>

            <div class="example-card">
              <div class="example-label">4</div>
              <div class="asset-preview" id="examplePreview4"></div>
              <input id="example4" class="input" type="file" accept=".png,.jpg,.jpeg,.webp" />
              <button data-clear-example="4" class="btn clear-example" type="button">Quitar</button>
            </div>
          </div>

          <div class="row left">
            <button id="generateGrid" class="btn" type="button">Generar grid 2x2 desde ejemplos</button>
          </div>

          <hr />

          <div class="section-title">Grid 2x2 real de referencia</div>
          <div class="asset-row">
            <div class="asset-preview wide" id="referenceGridPreview"></div>
            <div class="asset-actions">
              <input id="referenceGrid" class="input" type="file" accept=".png,.jpg,.jpeg,.webp" />
              <button id="clearReferenceGrid" class="btn" type="button">Quitar grid</button>
            </div>
          </div>

          <div id="status" class="status"></div>
          <div id="result" class="result hidden"></div>
        </main>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
